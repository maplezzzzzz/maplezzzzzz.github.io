name: Flipgold mobile adventure check
on:
  push:
    branches: [master, flipgold-adventure-v3]
    paths:
      - flipgold/**
      - .github/flipgold-check.cjs
      - .github/workflows/flipgold-mobile-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_PATH: /tmp/flipgold-qa/node_modules
    steps:
      - name: Check out the exact game revision
        uses: actions/checkout@v4
      - name: Install isolated Playwright
        run: npm install --prefix /tmp/flipgold-qa --no-save playwright
      - name: Install Chromium
        run: /tmp/flipgold-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Play the adventure on phone screens and check saved progress
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/flipgold-http.log 2>&1 &
          node .github/flipgold-check.cjs
      - name: Save game previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flipgold-adventure-previews
          path: game-previews/*.jpg
          if-no-files-found: ignore
