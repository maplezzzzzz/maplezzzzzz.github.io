name: Package Flipgold collectible coins
on:
  push:
    branches: [flipgold-growth-v6]
    paths: [.github/flipgold-special-pack.py, .github/workflows/flipgold-special-pack.yml]
permissions:
  contents: write
jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install Pillow
      - name: Package generated coin sprites
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/flipgold-special-pack.py
