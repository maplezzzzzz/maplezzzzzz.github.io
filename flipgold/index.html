<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#38513b"><title>翻金镇 · 栗栗的金币庭院</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#29412d;overscroll-behavior:none}body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}canvas{display:block;position:fixed;left:0;top:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;outline:none}</style></head><body><canvas id="game" tabindex="0" role="application" aria-label="翻金镇金币庭院。轻触或滑过硬币赚钱，点闪光硬币获得三倍收益。林间邮差带来奇遇，小松鼠栗栗每次帮翻一枚。空格翻币，Shift加空格旋风，F喂橡果，Tab选择按钮，回车确认。">请使用支持 Canvas 的现代浏览器游玩翻金镇。</canvas><script>
const BUILD='世界旅行 · 4.0';
const TYPES={copper:{name:'幸运铜币',value:1},clover:{name:'四叶草币',value:3},sun:{name:'日光金币',value:5},royal:{name:'古王硬币',value:8},berry:{name:'莓果纪念币',value:12},river:{name:'潮汐蓝币',value:18},crystal:{name:'水晶矿币',value:30},frost:{name:'雪松银币',value:50},star:{name:'云岛星币',value:80},dawn:{name:'极光徽币',value:130}};
const SLOTS=[[2,1],[1,1],[3,1],[0,1],[4,1],[2,2],[1,2],[3,2],[0,2],[4,2],[2,0],[1,0],[3,0],[0,0],[4,0],[2,3],[1,3],[3,3],[0,3],[4,3]];
const PET_MS=[0,4000,3200,2500,1900,1400,1000,750];
const STORY={
first:{title:'叮！一束小小的光',line:'这枚硬币……还记得爷爷的声音！再翻几次，庭院就会醒来。'},
shovel:{title:'爷爷的旧铲子',line:'铲柄上的三个凹槽，可以同时托起三枚硬币。咱们试试看！'},
pet:{title:'栗栗的约定',line:'我负责翻币，你负责寻找惊喜。等钟楼响起，我们就能找到爷爷留下的信！'},
land1:{title:'四叶草下的手记',line:'“把好运分给朋友，它就会长大。”栗栗读完，认真地把手记收进了口袋。'},
wide:{title:'金叶旋风',line:'宽铲翻起了一排金光。等硬币都亮起来，再放旋风，会赚得更多！'},
land2:{title:'被树根藏起的街道',line:'石板拼成了回家的路。远处的钟楼里，传来了很轻的滴答声。'},
magnet:{title:'指尖的小磁场',line:'把手指滑过庭院，附近的硬币都会跟上。爷爷果然藏了好多小发明！'},
land3:{title:'最后一片回忆',line:'旧照片里，爷爷和一只小松鼠站在钟楼前。栗栗说：“原来我也来过这里。”'},
clock:{title:'给未来的寻宝人',line:'“如果你听到了钟声，说明这里已经重新有了笑声。谢谢你，让我们的家醒来。”'}
};
function freshPlay(s){return {rev:3,nuts:0,charm:'none',sparkHits:0,visits:0,skillUses:0,deliveries:0,pity:0,seen:[],jobStart:{manual:s.manual||0,petFlips:s.petFlips||0,sparkHits:0}};}
function validV2(s){
 if(!s||s.v!==2)return false;
 for(const [k,lo,hi] of [['gold',0,Number.MAX_SAFE_INTEGER],['total',0,Number.MAX_SAFE_INTEGER],['manual',0,1e10],['petGold',0,Number.MAX_SAFE_INTEGER],['petFlips',0,1e10],['tool',0,3],['power',1,6],['land',0,3],['dig',0,5],['pet',0,7],['seconds',0,1e10],['lastSeen',0,1e16]])if(!Number.isFinite(s[k])||s[k]<lo||s[k]>hi)return false;
 if(!['tool','power','land','dig','pet','manual','petFlips'].every(k=>Number.isInteger(s[k])))return false;
 if(!['clock','started','sound','music','haptic'].every(k=>typeof s[k]==='boolean'))return false;
 if(s.total<s.gold||s.petGold>s.total)return false;
 if(!Array.isArray(s.coins)||!s.coins.length||s.coins.length>8+s.land*4||s.coins.some(t=>typeof t!=='string'||!Object.prototype.hasOwnProperty.call(TYPES,t)))return false;
 if(!Array.isArray(s.claimed)||s.claimed.length>10||s.claimed.some((i,n)=>!Number.isInteger(i)||i!==n))return false;
 if(s.pet&&!s.tool||s.tool&&s.coins.length<3||s.land&&!s.pet||s.tool>=2&&s.land<1||s.tool>=3&&s.land<2||s.dig&&(s.land>=3||!s.tool||!s.pet)||s.clock&&(s.pet<3||s.land<2))return false;
 if(s.play!==undefined){
  const p=s.play;if(!p||p.rev!==3||!['none','spark','nest'].includes(p.charm))return false;
  for(const k of ['nuts','sparkHits','visits','skillUses','deliveries','pity'])if(!Number.isInteger(p[k])||p[k]<0||p[k]>1e10)return false;
  if(!Array.isArray(p.seen)||p.seen.length>9||new Set(p.seen).size!==p.seen.length||p.seen.some(k=>!Object.prototype.hasOwnProperty.call(STORY,k)))return false;
  if(!p.jobStart||!['manual','petFlips','sparkHits'].every(k=>Number.isInteger(p.jobStart[k])&&p.jobStart[k]>=0))return false;
  if(p.jobStart.manual>s.manual||p.jobStart.petFlips>s.petFlips||p.jobStart.sparkHits>p.sparkHits)return false;
 }
 if(s.play?.world!==undefined&&!validWorld(s.play.world,s))return false;
 return true;
}
class Town{
 constructor(s=null,rng=Math.random){
  this.s=s||{v:2,gold:0,total:0,manual:0,petGold:0,petFlips:0,coins:['copper'],tool:0,power:1,land:0,dig:0,pet:0,clock:false,claimed:[],started:false,seconds:0,sound:true,music:true,haptic:true,lastSeen:Date.now()};
  if(!this.s.play)this.s.play=freshPlay(this.s);
  if(!this.s.play.world)this.s.play.world=freshWorld(this.s);
  this.rng=rng;this.cd=new Array(20).fill(0);this.chain=0;this.lastHit=-1e5;this.decayAt=0;this.feverUntil=0;this.skillAt=0;this.petAt=500;this.petCursor=0;this.petFlight=null;this.activeTime=0;this.shiny=null;this.sparkAt=6000;this.visitor=null;this.visitAt=20000;this.buff=null;this.feedUntil=0;this.feedAt=0;this.lastDig=-1e5;
 }
 capacity(){return 8+this.s.land*4;}
 coinCost(){return Math.round(10*Math.pow(1.29,this.s.coins.length-1));}
 petCost(){return this.s.pet===0?90:[0,150,340,750,1400,2500,4200][this.s.pet]||Infinity;}
 powerCost(){return Math.round(90*Math.pow(2.2,this.s.power-1));}
 landCost(){return [200,900,3000][this.s.land]||Infinity;}
 gain(n,pet=false){if(!Number.isFinite(n)||n<=0)return 0;const amount=Math.min(Math.floor(n),Number.MAX_SAFE_INTEGER-this.s.gold,Number.MAX_SAFE_INTEGER-this.s.total);if(amount<=0)return 0;this.s.gold+=amount;this.s.total+=amount;if(pet)this.s.petGold+=amount;return amount;}
 pay(n){if(!Number.isFinite(n)||n<0||this.s.gold<n)return false;this.s.gold-=n;return true;}
 buy(id){let s=this.s;
  if(id==='coin'&&s.coins.length<this.capacity()&&this.pay(this.coinCost())){s.coins.push('copper');return true;}
  if(id==='shovel'&&s.tool===0&&s.coins.length>=3&&this.pay(55)){s.tool=1;return true;}
  if(id==='wide'&&s.tool===1&&s.land>=1&&this.pay(340)){s.tool=2;this.skillAt=0;return true;}
  if(id==='magnet'&&s.tool===2&&s.land>=2&&this.pay(1900)){s.tool=3;this.skillAt=0;return true;}
  if(id==='power'&&s.power<6&&this.pay(this.powerCost())){s.power++;return true;}
  if(id==='pet'&&s.tool>=1&&s.pet<7&&this.pay(this.petCost())){s.pet++;this.petAt=this.activeTime+250;if(s.pet===1)s.play.nuts+=3;return true;}
  if(id==='land'&&s.tool>=1&&s.pet>=1&&s.land<3&&!s.dig&&(s.land===0||s.tool>=2)&&this.pay(this.landCost())){s.dig=5;return true;}
  if(id==='clock'&&s.pet>=3&&s.land>=2&&!s.clock&&this.pay(6800)){s.clock=true;return true;}return false;
 }
 dig(t=this.activeTime){
  if(!this.s.dig||this.s.land>=3||t-this.lastDig<320)return null;this.lastDig=t;this.s.dig--;
  if(this.s.dig)return {remaining:this.s.dig};
  this.s.land++;const type=['','clover','sun','royal'][this.s.land];this.s.coins.push('copper',type);
  const bonus=[0,75,200,500][this.s.land],surprise=this.rng()<.3?Math.floor(bonus*(.2+this.rng()*.3)):0,amount=this.gain(bonus+surprise);
  this.s.play.nuts+=2;
  return {remaining:0,land:this.s.land,type,bonus,surprise,amount,story:STORY['land'+this.s.land].line};
 }
 cooldown(){return (this.s.clock?650:950)*(this.buff&&this.buff.kind==='rain'&&this.activeTime<this.buff.until ? .65 : 1);}
 value(i){return TYPES[this.s.coins[i]].value*this.s.power;}
 charge(n,t){this.chain=Math.min(24,this.chain+n);if(this.chain>=24&&t>=this.feverUntil){this.chain=0;this.feverUntil=t+8000;return true;}return false;}
 flip(i,t,source='hand',boost=1){
  if(!this.s.coins[i]||t<this.cd[i]||(source!=='pet'&&this.petFlight&&this.petFlight.i===i))return null;
  this.cd[i]=t+this.cooldown();const pet=source==='pet',spark=!!(this.shiny&&this.shiny.i===i&&t<this.shiny.until);
  let crit=false,fever=t<this.feverUntil,trigger=false;
  if(!pet){
   this.s.manual++;this.s.play.pity++;crit=this.rng()<(this.s.play.charm==='spark' ? .22 : .08)||this.s.play.pity>=14;
   if(crit)this.s.play.pity=0;
   if(!fever)trigger=this.charge(1+(spark?2:0)+(crit?1:0),t);
   this.lastHit=t;this.decayAt=t+3500;
  }else{this.s.petFlips++;if(this.s.petFlips%10===0)this.s.play.nuts++;}
  if(spark){this.shiny=null;this.s.play.sparkHits++;}
  fever=fever||trigger;
  const multiplier=(fever?2:1)*(spark?3:crit?3:1)*boost*(pet&&this.s.play.charm==='nest'?2:1);
  const amount=this.gain(this.value(i)*multiplier,pet);
  return amount?{i,amount,source,rare:this.s.coins[i]!=='copper',fever,spark,crit,trigger,nut:pet&&this.s.petFlips%10===0}:null;
 }
 targets(i){if(!SLOTS[i])return [];let [x,y]=SLOTS[i],ids=this.s.coins.map((_,j)=>j);if(!this.s.tool)return[i];if(this.s.tool===1)return ids.sort((a,b)=>(SLOTS[a][0]-x)**2+(SLOTS[a][1]-y)**2-((SLOTS[b][0]-x)**2+(SLOTS[b][1]-y)**2)).slice(0,3);if(this.s.tool===2)return ids.filter(j=>SLOTS[j][1]===y);return ids.filter(j=>Math.abs(SLOTS[j][0]-x)<=1&&Math.abs(SLOTS[j][1]-y)<=1);}
 swing(i,t){return this.targets(i).map(j=>this.flip(j,t)).filter(Boolean);}
 skill(t){if(this.s.tool<2||t<this.skillAt)return[];const ids=this.s.coins.map((_,i)=>i).filter(i=>t>=this.cd[i]&&this.petFlight?.i!==i);const hits=ids.map(i=>this.flip(i,t,'skill',2)).filter(Boolean);if(hits.length){this.skillAt=t+(this.s.tool>=3?9000:16000);this.s.play.skillUses++;}return hits;}
 petInterval(t){return PET_MS[this.s.pet]*(t<this.feedUntil ? .65 : 1);}
 feed(t){if(!this.s.pet||this.s.play.nuts<1||t<this.feedAt)return false;this.s.play.nuts--;this.feedUntil=t+14000;this.feedAt=t+24000;return true;}
 setCharm(charm){if(!this.s.pet||!['spark','nest'].includes(charm))return false;this.s.play.charm=charm;return true;}
 catchVisitor(t){if(!this.visitor||t>this.visitor.until)return null;const kind=this.visitor.kind;this.visitor=null;this.s.play.visits++;this.s.play.nuts++;let amount=0;
  if(kind==='gift')amount=this.gain((12+this.s.coins.length*3)*this.s.power);
  if(kind==='wind'){this.feverUntil=Math.max(this.feverUntil,t+10000);}
  if(kind==='rain'){this.buff={kind,until:t+14000};}
  return {kind,amount};
 }
 tick(t){
  this.activeTime=t;const events=[];
  if(this.chain&&t>this.decayAt&&t>=this.feverUntil){this.chain=Math.max(0,this.chain-Math.floor((t-this.decayAt)/1500)-1);this.decayAt=t+1500;}
  if(this.shiny&&t>=this.shiny.until){this.shiny=null;this.sparkAt=t+4500;}
  if(!this.shiny&&t>=this.sparkAt&&!this.petFlight){const ids=this.s.coins.map((_,i)=>i).filter(i=>t>=this.cd[i]);if(ids.length){const i=ids[Math.floor(this.rng()*ids.length)];this.shiny={i,until:t+4300,start:t};this.sparkAt=t+10500+this.rng()*4000;events.push({kind:'spark',i});}else this.sparkAt=t+300;}
  if(this.visitor&&t>=this.visitor.until)this.visitor=null;
  if(!this.visitor&&t>=this.visitAt){this.visitor={kind:['gift','wind','rain'][Math.floor(this.rng()*3)],start:t,until:t+15000};this.visitAt=t+42000+this.rng()*22000;events.push({kind:'visitor'});}
  if(this.buff&&t>=this.buff.until)this.buff=null;
  const interval=this.petInterval(t);
  // Bounded catch-up uses scheduled arrival times; frame drops do not slow production.
  for(let cycle=0;cycle<12&&this.s.pet;cycle++){
   if(this.petFlight){
    if(t<this.petFlight.arrive)break;const f=this.petFlight;
    if(f.arrive<this.cd[f.i]){f.arrive=this.cd[f.i];if(t<f.arrive)break;}
    const hit=this.flip(f.i,f.arrive,'pet');this.petFlight=null;this.petAt=f.arrive+Math.max(140,interval-f.travel);
    if(hit)events.push({kind:'petHit',hit,at:f.arrive});
   }
   if(t<this.petAt||this.petFlight)break;
   let chosen=-1;for(let j=0;j<this.s.coins.length;j++){const i=(this.petCursor+j)%this.s.coins.length;if(this.petAt>=this.cd[i]){chosen=i;break;}}
   if(chosen<0){this.petAt=Math.max(this.petAt+120,Math.min(...this.cd.slice(0,this.s.coins.length)));if(this.petAt>t)break;continue;}
   this.petCursor=(chosen+1)%this.s.coins.length;const [x,y]=SLOTS[chosen],distance=Math.hypot(x-0,y-3)/5,travel=Math.max(160,Math.min(650,interval*.52)*(.72+.28*distance));
   this.petFlight={i:chosen,start:this.petAt,arrive:this.petAt+travel,travel};events.push({kind:'petGo',i:chosen,start:this.petAt,arrive:this.petAt+travel});if(this.petFlight.arrive>t)break;
  }
  return events;
 }
 goals(){const s=this.s;return[
 {title:'叫醒第一枚硬币',hint:'翻币 8 次，看看光会去哪里',now:s.manual,max:8,reward:12,action:'home'},
 {title:'好运，要成群结伴',hint:'添到 3 枚硬币',now:s.coins.length,max:3,reward:20,action:'coin'},
 {title:'找到爷爷的小铲子',hint:'一铲翻 3 枚 · 55 金币',now:s.tool,max:1,reward:30,action:'shovel'},
 {title:'和栗栗做个约定',hint:'招募栗栗 · 90 金币',now:s.pet,max:1,reward:45,action:'pet'},
 {title:'树根下藏着什么？',hint:s.dig?'点击土堆，继续挖掘':'开拓藏宝地 · 200 金币',now:s.land,max:1,reward:80,action:'land'},
 {title:'试试金色的旋风',hint:'宽铲与全庭院技能 · 340 金币',now:s.tool,max:2,reward:120,action:'wide'},
 {title:'让硬币更加闪亮',hint:'抛光至 Lv.2，稀有币一起变强',now:s.power,max:2,reward:150,action:'power'},
 {title:'栗栗的寻宝训练',hint:'伙伴升至 Lv.3，解锁小绿帽',now:s.pet,max:3,reward:220,action:'pet'},
 {title:'找回回家的旧街道',hint:'挖开第二片土地',now:s.land,max:2,reward:350,action:'land'},
 {title:'把整座小镇唤醒',hint:'栗栗 Lv.3 + 旧街道 · 6800 金币',now:+s.clock,max:1,reward:1000,action:'clock'}];}
 goalIndex(){return this.goals().findIndex((g,i)=>!this.s.claimed.includes(i));}
 claim(){const i=this.goalIndex(),q=this.goals()[i];if(!q||q.now<q.max)return null;this.s.claimed.push(i);this.gain(q.reward);if(this.s.pet)this.s.play.nuts++;return q;}
 job(){const p=this.s.play,k=p.deliveries%3,base=p.jobStart;const now=[this.s.manual-base.manual,this.s.petFlips-base.petFlips,p.sparkHits-base.sparkHits][k],max=[35,12,3][k];return {title:['栗栗的叮当练习','装满伙伴的小口袋','追上三束闪光'][k],hint:['手动翻动 35 枚硬币','让栗栗翻动 12 枚硬币','翻到 3 枚闪光币'][k],now,max,reward:(50+this.s.land*35)*this.s.power};}
 deliver(){const q=this.job();if(!this.s.pet||q.now<q.max)return null;this.gain(q.reward);this.s.play.nuts+=2;this.s.play.deliveries++;this.s.play.jobStart={manual:this.s.manual,petFlips:this.s.petFlips,sparkHits:this.s.play.sparkHits};return q;}
 offline(seconds){if(!this.s.pet||!Number.isFinite(seconds))return 0;const n=Math.min(7200,Math.max(0,seconds)),avg=this.s.coins.reduce((v,c)=>v+TYPES[c].value,0)/this.s.coins.length*this.s.power;return this.gain(n/(PET_MS[this.s.pet]/1000)*avg*.5*(this.s.play.charm==='nest'?2:1),true);}
}

const ZONES=[
 {name:'金币庭院',label:'旧家与钟楼',icon:'house',color:'#e4cf92',sky:['#d9ead7','#b2ce9c'],cost:0,coin:'clover',weather:'温柔晴天',effect:'适合熟悉工具。翻币与栗栗一起蓄满好运。',story:['庭院的邮差带来了一张旧地图。原来我们的小院，只是旅途的起点。','邮差说，河对岸的果园也在等叮当声。栗栗把第一枚四叶草币装进背包。','家找回来了。栗栗却望向地图：我们去把其他地方也叫醒，好吗？']},
 {name:'莓果果园',label:'第二章 · 忘记收获的果园',icon:'seedling',color:'#efb6ad',sky:['#fae2d9','#d5bca2'],cost:2500,coin:'berry',weather:'丰收微风',effect:'手动翻币额外增加 10% 暴击。',story:['果园里的兔子阿绒，把最后一筐莓果留给了冬天。我们要让收获重新回来。','第一串莓果成熟了。阿绒送来一封旧信：爷爷曾从这条小路去过河湾。','果树挂满果实。阿绒决定同行，帮你在每次手动翻币时多蓄一点好运。']},
