<body><canvas id="game" tabindex="0" role="application" aria-label="翻金镇：触摸硬币赚钱；底部依次为庭院、装备、伙伴、图鉴、手记。键盘空格翻币，Tab 选择按钮，回车确认。">翻金镇需要支持 Canvas 的浏览器。请使用近期版本的 Safari、Chrome 或 Edge。</canvas>
<script>


const TYPES={copper:{name:'幸运铜币',value:1},clover:{name:'四叶草币',value:3},sun:{name:'日光金币',value:5},royal:{name:'古王硬币',value:8}};
const SLOTS=[[2,1],[1,1],[3,1],[0,1],[4,1],[2,2],[1,2],[3,2],[0,2],[4,2],[2,0],[1,0],[3,0],[0,0],[4,0],[2,3],[1,3],[3,3],[0,3],[4,3]];
const PET_MS=[0,4000,3200,2500,1900,1400,1000,750];
class Town{
 constructor(s=null){this.s=s||{v:2,gold:0,total:0,manual:0,petGold:0,petFlips:0,coins:['copper'],tool:0,power:1,land:0,dig:0,pet:0,clock:false,claimed:[],started:false,seconds:0,sound:true,music:true,haptic:true,lastSeen:Date.now()};this.cd=new Array(20).fill(0);this.chain=0;this.lastHit=-10000;this.feverUntil=0;this.skillAt=0;this.petAt=0;this.petCursor=0;this.petFlight=null;this.activeTime=0;}
 capacity(){return 8+this.s.land*4;}
 coinCost(){return Math.round(10*Math.pow(1.29,this.s.coins.length-1));}
 petCost(){return this.s.pet===0?120:[0,180,400,850,1600,2800,4500][this.s.pet]||Infinity;}
 powerCost(){return Math.round(110*Math.pow(2.35,this.s.power-1));}
 landCost(){return [220,1000,3400][this.s.land]||Infinity;}
 gain(n,pet=false){if(!Number.isFinite(n)||n<=0)return 0;n=Math.min(Math.floor(n),1e12-this.s.gold,1e13-this.s.total);if(!Number.isFinite(n)||n<=0)return 0;this.s.gold+=n;this.s.total+=n;if(pet)this.s.petGold+=n;return n;}
 pay(n){if(!Number.isFinite(n)||this.s.gold<n)return false;this.s.gold-=n;return true;}
 buy(id){let s=this.s;
 if(id==='coin'&&s.coins.length<this.capacity()&&this.pay(this.coinCost())){s.coins.push('copper');return true;}
 if(id==='shovel'&&s.tool===0&&s.coins.length>=3&&this.pay(55)){s.tool=1;return true;}
 if(id==='wide'&&s.tool===1&&s.land>=1&&this.pay(380)){s.tool=2;this.skillAt=0;return true;}
 if(id==='magnet'&&s.tool===2&&s.land>=2&&this.pay(2200)){s.tool=3;this.skillAt=0;return true;}
 if(id==='power'&&s.power<6&&this.pay(this.powerCost())){s.power++;return true;}
 if(id==='pet'&&s.tool>=1&&s.pet<7&&this.pay(this.petCost())){s.pet++;this.petAt=this.activeTime+250;return true;}
 if(id==='land'&&s.tool>=1&&s.pet>=1&&s.land<3&&!s.dig&&(s.land===0||s.tool>=2)&&this.pay(this.landCost())){s.dig=5;return true;}
 if(id==='clock'&&s.pet>=3&&s.land>=2&&!s.clock&&this.pay(8800)){s.clock=true;return true;}return false;
 }
 dig(){if(!this.s.dig||this.s.land>=3)return null;this.s.dig--;if(this.s.dig)return {remaining:this.s.dig};this.s.land++;this.s.coins.push('copper',['','clover','sun','royal'][this.s.land]);let bonus=[0,65,170,420][this.s.land],surprise=Math.random()<.28?Math.max(1,Math.floor(bonus*(.2+Math.random()*.2))):0;const amount=this.gain(bonus+surprise);surprise=Math.min(surprise,Math.max(0,amount-bonus));const stories=['','栗栗翻开爷爷的手记：“好运要和朋友分享。”','树根下露出旧街石板。爷爷说，钟楼齿轮就藏在古树根下。','最后一块齿轮擦亮后，远处的钟楼传来一声轻轻的回响。'];return {remaining:0,land:this.s.land,type:this.s.coins.at(-1),bonus,surprise,amount,story:stories[this.s.land]};}
 cooldown(){return this.s.clock?800:1250;}
 value(i){return TYPES[this.s.coins[i]].value*this.s.power;}
 flip(i,t,source='hand',boost=1){if(!this.s.coins[i]||t<this.cd[i]||(source!=='pet'&&this.petFlight&&this.petFlight.i===i))return null;this.cd[i]=t+this.cooldown();let fever=t<this.feverUntil;
 if(source!=='pet'){this.s.manual++;if(!fever){this.chain=t-this.lastHit<2100?this.chain+1:1;if(this.chain>=24){this.chain=0;this.feverUntil=t+6500;fever=true;}}this.lastHit=t;}else this.s.petFlips++;
 const amount=this.value(i)*(fever?2:1)*boost;this.gain(amount,source==='pet');return {i,amount,source,rare:this.s.coins[i]!=='copper',fever};
 }
 targets(i){if(!SLOTS[i])return [];let [x,y]=SLOTS[i],n=this.s.coins.length,ids=Array.from({length:n},(_,j)=>j);if(this.s.tool===0)return[i];if(this.s.tool===1)return ids.sort((a,b)=>((SLOTS[a][0]-x)**2+(SLOTS[a][1]-y)**2)-((SLOTS[b][0]-x)**2+(SLOTS[b][1]-y)**2)).slice(0,3);if(this.s.tool===2)return ids.filter(j=>SLOTS[j][1]===y);return ids.filter(j=>Math.abs(SLOTS[j][0]-x)<=1&&Math.abs(SLOTS[j][1]-y)<=1);}
 swing(i,t){return this.targets(i).map(j=>this.flip(j,t)).filter(Boolean);}
 skill(t){if(this.s.tool<2||t<this.skillAt)return[];const ids=this.s.coins.map((_,i)=>i).filter(i=>t>=this.cd[i]&&!(this.petFlight&&this.petFlight.i===i));if(!ids.length)return[];const hits=ids.map(i=>this.flip(i,t,'skill',2)).filter(Boolean);if(hits.length)this.skillAt=t+(this.s.tool>=3?10000:18000);return hits;}
 tick(t){this.activeTime=t;const events=[];if(this.chain&&t-this.lastHit>2100&&t>=this.feverUntil)this.chain=0;if(this.petFlight&&t>=this.petFlight.arrive){const i=this.petFlight.i;if(this.petFlight.arrive<this.cd[i]){this.petFlight.arrive=this.cd[i];return events;}const arrived=this.petFlight.arrive,hit=this.flip(i,arrived,'pet');this.petFlight=null;this.petAt=arrived+Math.max(120,PET_MS[this.s.pet]-Math.min(650,PET_MS[this.s.pet]*.65));if(hit)events.push({kind:'petHit',hit});}
 if(this.s.pet&&!this.petFlight&&t>=this.petAt){let n=this.s.coins.length,chosen=-1;for(let j=0;j<n;j++){let i=(this.petCursor+j)%n;if(t>=this.cd[i]){chosen=i;break;}}if(chosen>=0){this.petCursor=(chosen+1)%n;const start=this.petAt;this.petFlight={i:chosen,start,arrive:start+Math.min(650,PET_MS[this.s.pet]*.65)};events.push({kind:'petGo',i:chosen});}else this.petAt=t+180;}return events;}
 goals(){let s=this.s;return[
 {title:'让第一枚硬币醒来',hint:'翻动硬币 8 次',now:s.manual,max:8,reward:12},
 {title:'好运，要成群结伴',hint:'拥有 3 枚硬币',now:s.coins.length,max:3,reward:20},
 {title:'一铲，叮当三声',hint:'购买小铲子',now:s.tool,max:1,reward:30},
 {title:'第一位寻宝伙伴',hint:'招募小松鼠「栗栗」',now:s.pet,max:1,reward:45},
 {title:'树根下的惊喜',hint:'开拓土地，再挖 5 铲',now:s.land,max:1,reward:75},
 {title:'一阵金色旋风',hint:'购买宽铲，解锁主动技能',now:s.tool,max:2,reward:120},
 {title:'闪闪发光的金币',hint:'将抛光升级到 2 级',now:s.power,max:2,reward:160},
 {title:'栗栗跑得更快了',hint:'将伙伴升级至 3 级',now:s.pet,max:3,reward:240},
 {title:'找回地下的旧街道',hint:'挖开第二片土地',now:s.land,max:2,reward:340},
 {title:'把整座小镇唤醒',hint:'修复钟楼',now:+s.clock,max:1,reward:800}
 ];}
 goalIndex(){return this.goals().findIndex((g,i)=>!this.s.claimed.includes(i));}
 claim(){let i=this.goalIndex(),q=this.goals()[i];if(!q||q.now<q.max)return null;this.s.claimed.push(i);this.gain(q.reward);return q;}
 offline(seconds){if(!this.s.pet||!Number.isFinite(seconds))return 0;let n=Math.min(7200,Math.max(0,seconds)),avg=this.s.coins.reduce((v,c)=>v+TYPES[c].value,0)/this.s.coins.length*this.s.power,amount=Math.floor(n/(PET_MS[this.s.pet]/1000)*avg*.5);return this.gain(amount,true);}
}
function validV2(s){if(!s||s.v!==2)return false;for(let [k,lo,hi] of [['gold',0,1e12],['total',0,1e13],['manual',0,1e10],['petGold',0,1e13],['petFlips',0,1e10],['tool',0,3],['power',1,6],['land',0,3],['dig',0,5],['pet',0,7],['seconds',0,1e10],['lastSeen',0,1e16]])if(!Number.isFinite(s[k])||s[k]<lo||s[k]>hi)return false;
 if(!['tool','power','land','dig','pet','manual','petFlips'].every(k=>Number.isInteger(s[k])))return false;
 if(!['clock','started','sound','music','haptic'].every(k=>typeof s[k]==='boolean'))return false;
 if(s.total<s.gold||s.petGold>s.total)return false;
 if(!Array.isArray(s.coins)||!s.coins.length||s.coins.length>8+s.land*4||s.coins.some(t=>typeof t!=='string'||!Object.prototype.hasOwnProperty.call(TYPES,t)))return false;
 if(!Array.isArray(s.claimed)||s.claimed.length>10||s.claimed.some((i,n)=>!Number.isInteger(i)||i!==n))return false;
 if(s.pet&&!s.tool||s.tool&&s.coins.length<3||s.land&&!s.pet||s.tool>=2&&s.land<1||s.tool>=3&&s.land<2||s.dig&&(s.land>=3||!s.tool||!s.pet)||s.clock&&(s.pet<3||s.land<2))return false;return true;}


const C={ink:'#664323',dark:'#55381f',cream:'#fff1c3',gold:'#f6c851',green:'#668b47',green2:'#99bb64',brown:'#b87838',paper:'#f7e3ad',shadow:'#583916',white:'#fff9dd'};
function rr(x,y,w,h,r=14){r=Math.min(r,w/2,h/2);cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
function box(x,y,w,h,fill,stroke=C.ink,r=14,lw=2){rr(x,y,w,h,r);cx.fillStyle=fill;cx.fill();if(stroke){cx.strokeStyle=stroke;cx.lineWidth=lw;cx.stroke();}}
function ellipse(x,y,rx,ry,fill,stroke=null,lw=2){cx.beginPath();cx.ellipse(x,y,rx,ry,0,0,Math.PI*2);cx.fillStyle=fill;cx.fill();if(stroke){cx.strokeStyle=stroke;cx.lineWidth=lw;cx.stroke();}}
function path(points,fill,stroke=C.ink,lw=2){cx.beginPath();for(let i=0;i<points.length;i++){if(i===0)cx.moveTo(...points[i]);else cx.lineTo(...points[i]);}cx.closePath();if(fill){cx.fillStyle=fill;cx.fill();}if(stroke){cx.strokeStyle=stroke;cx.lineWidth=lw;cx.lineJoin='round';cx.stroke();}}
function line(x,y,x2,y2,color=C.ink,width=2){cx.beginPath();cx.moveTo(x,y);cx.lineTo(x2,y2);cx.strokeStyle=color;cx.lineWidth=width;cx.lineCap='round';cx.stroke();}
function text(str,x,y,size=14,color=C.ink,align='left',weight=700,outline=0){cx.font=weight+' '+size+'px "PingFang SC","Microsoft YaHei",sans-serif';cx.textAlign=align;cx.textBaseline='middle';if(outline){cx.strokeStyle=C.dark;cx.lineWidth=outline;cx.lineJoin='round';cx.strokeText(String(str),x,y);}cx.fillStyle=color;cx.fillText(String(str),x,y);}
function wrap(str,x,y,max,size=14,color=C.ink,lh=23,align='left'){let row='',n=0;cx.font='600 '+size+'px "PingFang SC",sans-serif';for(const ch of str){if(ch==='\n'||cx.measureText(row+ch).width>max){text(row,x,y+n*lh,size,color,align,600);row=ch==='\n'?'':ch;n++;}else row+=ch;}text(row,x,y+n*lh,size,color,align,600);return(n+1)*lh;}
function grad(y,h,a,b){let g=cx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,a);g.addColorStop(1,b);return g;}
function panel(x,y,w,h,kind='paper'){box(x,y+5,w,h,'#50361f66',null,20);box(x,y,w,h,kind==='wood'?grad(y,h,'#cd9955','#a96c32'):grad(y,h,'#fff0c9','#edd59e'),C.ink,20,3);rr(x+5,y+5,w-10,h-10,15);cx.strokeStyle=kind==='wood'?'#e8b978':'#fff8dc';cx.lineWidth=2;cx.stroke();if(kind==='wood'){line(x+16,y+13,x+w-20,y+13,'#f0c98b77',2);line(x+20,y+h-14,x+w-23,y+h-14,'#774b2733',2);}}
function star(x,y,r,fill='#fff2aa',stroke=null){const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,v=i%2?r*.43:r;p.push([x+Math.cos(a)*v,y+Math.sin(a)*v]);}path(p,fill,stroke,1.3);}
function coin(x,y,r=24,type='copper',phase=0,ready=true){cx.save();cx.translate(x,y);const lift=phase?Math.sin(phase*Math.PI)*18:0,sx=phase?Math.max(.09,Math.abs(Math.cos(phase*Math.PI*2))):1;cx.translate(0,-lift);cx.scale(sx,1);ellipse(0,r*.53,r*.86,r*.28,'#72502738');ellipse(0,4,r,r*.85,'#b87a25',C.ink,2);ellipse(0,0,r,r*.86,grad(-r,2*r,'#fff2a4','#edb738'),C.ink,2.2);ellipse(0,-1,r*.77,r*.64,'#efbe4f','#c68b2e',1.5);cx.save();cx.scale(r/24,r/24);if(type==='copper'){star(0,-1,12,'#c58d30','#ffe7a0');}else if(type==='clover'){for(let [a,b]of [[-5,-6],[5,-6],[-5,3],[5,3]])ellipse(a,b,6,5,'#628740','#e6dd77',.8);line(1,5,-3,12,'#567233',2);}else if(type==='sun'){for(let i=0;i<8;i++){let a=i*Math.PI/4;line(Math.cos(a)*10,Math.sin(a)*10-1,Math.cos(a)*14,Math.sin(a)*14-1,'#b15e26',2);}ellipse(0,-1,7,7,'#fff0a2','#b66c2e',1.4);}else{path([[-12,-8],[-6,-2],[0,-12],[6,-2],[12,-8],[9,10],[-9,10]],'#9863a3','#fae4a0',1.6);ellipse(0,2,2,2,'#fbdd78');}line(-13,-12,-8,-15,'#fff7cc',2);cx.restore();if(!ready){ellipse(0,0,r*.96,r*.81,'#66452355');}cx.restore();}
function squirrel(x,y,scale=1,walk=0,level=1,flip=false){cx.save();cx.translate(x,y);cx.scale(flip?-scale:scale,scale);const b=Math.sin(walk)*2;
 ellipse(-1,30,25,6,'#54391f2b');cx.save();cx.translate(0,b);
 cx.beginPath();cx.moveTo(-9,20);cx.bezierCurveTo(-51,23,-58,-12,-41,-29);cx.bezierCurveTo(-19,-47,-11,-13,-29,-9);cx.bezierCurveTo(-43,-6,-28,12,-8,7);cx.closePath();cx.fillStyle='#c67b33';cx.fill();cx.strokeStyle='#71421f';cx.lineWidth=2.6;cx.stroke();
 cx.beginPath();cx.moveTo(-31,-21);cx.bezierCurveTo(-41,-19,-42,-5,-28,1);cx.strokeStyle='#f0ad5e';cx.lineWidth=5;cx.lineCap='round';cx.stroke();
 ellipse(-8,26+Math.sin(walk)*2,10,5,'#9b592c',C.ink);ellipse(12,27-Math.sin(walk)*2,10,5,'#9b592c',C.ink);
 ellipse(2,8,20,25,'#d78b42',C.ink,2.6);ellipse(4,12,11,16,'#f6cd8c');path([[-16,-23],[-18,-43],[-5,-33]],'#d88a42',C.ink,2.3);path([[9,-31],[22,-43],[20,-20]],'#d88a42',C.ink,2.3);path([[-14,-29],[-14,-37],[-8,-32]],'#efb278',null);path([[12,-32],[18,-37],[17,-28]],'#efb278',null);
 ellipse(3,-18,24,21,'#dc944b',C.ink,2.6);ellipse(7,-9,15,10,'#fbd99f');ellipse(-5,-21,4,6,'#493422');ellipse(14,-21,4,6,'#493422');ellipse(-6,-23,1.4,2,'#fff');ellipse(13,-23,1.4,2,'#fff');ellipse(7,-12,3.5,2.5,'#66412b');cx.beginPath();cx.arc(7,-7,4,0,Math.PI);cx.strokeStyle=C.ink;cx.lineWidth=1.3;cx.stroke();ellipse(-13,-11,4,2.5,'#eea179');ellipse(23,-11,4,2.5,'#eea179');
 path([[-14,-1],[3,3],[21,-2],[20,6],[3,10],[-16,5]],'#719c51','#4f713c',1.8);path([[12,7],[19,6],[19,24],[13,19]],'#8ab362','#4f713c',1.5);
 ellipse(-14,10,7,11,'#d78b42',C.ink,1.6);ellipse(19,10,7,11,'#d78b42',C.ink,1.6);
 if(level>=3){path([[-15,-35],[1,-52],[18,-37]],'#7c9f52','#526a33',1.5);line(-18,-35,22,-35,'#486a33',4);path([[9,-46],[18,-54],[16,-40]],'#e3bf5f','#8c7a36',1);}
 if(level>=5){box(-12,5,21,18,'#aa7436','#654b2c',4,1.5);line(-10,4,8,24,'#e3bb73',2);ellipse(0,12,2,2,'#f7d875');}
 cx.restore();cx.restore();}
function icon(name,x,y,size=30){cx.save();cx.translate(x,y);cx.scale(size/40,size/40);
 if(name==='coin'){coin(0,0,17);}
 else if(name==='pet'){squirrel(3,6,.48,0,1);}
 else if(name==='shovel'||name==='wide'){cx.rotate(.55);box(-3,-17,6,33,'#a36c35',C.ink,2);box(-9,-22,18,9,'#d4bc85',C.ink,4);if(name==='shovel'){path([[-11,4],[11,4],[11,15],[0,24],[-11,15]],'#aabfb0',C.ink,2);line(-6,10,6,10,'#e1ecdb',2);}else{box(-18,4,36,15,'#aabfb0',C.ink,4);line(-13,8,13,8,'#e1ecdb',2);}}
 else if(name==='magnet'){cx.rotate(-.35);cx.beginPath();cx.arc(0,0,12,0,Math.PI);cx.lineTo(-12,-16);cx.lineTo(-4,-16);cx.lineTo(-4,0);cx.arc(0,0,4,Math.PI,0,true);cx.lineTo(4,-16);cx.lineTo(12,-16);cx.closePath();cx.fillStyle='#e18752';cx.fill();cx.strokeStyle=C.ink;cx.lineWidth=2;cx.stroke();box(-12,-17,8,8,'#d7e2bc',C.ink,2,1);box(4,-17,8,8,'#d7e2bc',C.ink,2,1);}
 else if(name==='power'){star(0,0,20,'#f5cc5d',C.ink);star(0,0,9,'#fff2ad',null);}
 else if(name==='land'){path([[-19,4],[0,-9],[20,4],[0,18]],'#a87742',C.ink,2);path([[-19,-2],[0,-15],[20,-2],[0,11]],'#93aa58',C.ink,2);line(0,0,0,-13,'#567135',2);ellipse(-5,-12,6,3,'#7b9e4c','#506c35',1);}
 else if(name==='home'){box(-13,-1,27,21,'#f0c985',C.ink,3);path([[-19,-1],[0,-18],[20,-1]],'#a86335',C.ink,2);box(-3,7,8,13,'#916235',C.ink,2);ellipse(7,2,3,3,'#ffe8a0',C.ink,1);}
 else if(name==='book'||name==='album'){box(-17,-19,34,39,name==='book'?'#be8042':'#799758',C.ink,5,2);line(-9,-17,-9,18,'#efcd8b',2);if(name==='album')coin(3,0,10,'clover');else{line(-3,-7,11,-7,'#f7deb0',2);line(-3,0,11,0,'#f7deb0',2);line(-3,7,7,7,'#f7deb0',2);}}
 else if(name==='gear'){for(let i=0;i<8;i++){cx.save();cx.rotate(i*Math.PI/4);box(-3,-19,6,10,'#f2d69b',C.ink,2,1.2);cx.restore();}ellipse(0,0,13,13,'#f3d69c',C.ink,2);ellipse(0,0,5,5,'#96703c',C.ink,1);}
